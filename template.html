<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hercules Weekly Insight</title>
</head>
<!-- DESIGN PENDING: colors, fonts, and the hero illustration below are a
     placeholder look, not the real hercules.works blog design. Swap them
     in once that design is handed off -- see illustrations.py and
     config.ILLUSTRATION_MODE. -->
<body style="margin:0; padding:0; background-color:#f4f4f4; font-family:Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:12px; overflow:hidden;">

          <tr>
            <td style="padding:32px 32px 0 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="font-size:13px; letter-spacing:1px; text-transform:uppercase; color:#888888;">Hercules Weekly</td>
                  <td align="right">
                    <span style="display:inline-block; background-color:#eef0fb; color:#5B47F5; font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px;">2 min read</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:16px 32px 8px 32px;">
              <div style="font-size:26px; font-weight:700; color:#111111; line-height:1.3;">{{HOOK}}</div>
            </td>
          </tr>

          <tr>
            <td style="padding:8px 0 0 0;">
              <!-- HERO_ILLUSTRATION_HTML is injected by render.py, see illustrations.py -->
              {{HERO_ILLUSTRATION_HTML}}
            </td>
          </tr>

          <tr>
            <td style="padding:0 32px 20px 32px;">
              <div style="font-size:16px; color:#333333; line-height:1.65;">{{INSIGHT_PARAGRAPH}}</div>
            </td>
          </tr>

          <tr>
            <td style="padding:0 32px 8px 32px;">
              <!-- SUPPORTING_POINTS_HTML is injected as styled cards by render.py -->
              {{SUPPORTING_POINTS_HTML}}
            </td>
          </tr>

          <tr>
            <td style="padding:8px 32px 24px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-left:3px solid #5B47F5;">
                <tr>
                  <td style="padding:4px 0 4px 16px; font-size:16px; color:#333333; line-height:1.65; font-style:italic;">{{CLOSING_LINE}}</td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:0 32px 24px 32px;">
              <a href="{{CTA_URL}}" style="display:inline-block; background-color:#5B47F5; color:#ffffff; text-decoration:none; padding:12px 28px; border-radius:999px; font-size:15px; font-weight:600;">{{CTA_LABEL}}</a>
            </td>
          </tr>

          <tr>
            <td style="padding:0 32px 32px 32px; border-top:1px solid #eeeeee; padding-top:24px;">
              <div style="font-size:13px; color:#999999; line-height:1.6;">
                Based on: {{SOURCE_STUDY}}<br>
                You're getting this because you're part of Hercules.works.
                <a href="{{UNSUBSCRIBE_URL}}" style="color:#999999;">Unsubscribe</a>
              </div>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
