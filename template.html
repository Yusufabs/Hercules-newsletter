<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hercules Weekly Insight</title>
</head>
<!-- Brand tokens (colors, callout styles) are pulled from the real
     hercules.works blog design -- see config.py's BRAND_* settings. The
     hero graphic itself is still a generated placeholder pending real
     per-issue illustration artwork; see illustrations.py. -->
<body style="margin:0; padding:0; background-color:#f4f4f4; font-family:Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:12px; overflow:hidden;">

          <tr>
            <td style="padding:32px 32px 0 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="font-size:13px; letter-spacing:0.06em; text-transform:uppercase; color:{{BRAND_MUTED_COLOR}};">Hercules Weekly</td>
                  <td align="right">
                    <span style="display:inline-block; background-color:{{BRAND_CALLOUT_BG}}; color:{{BRAND_ACCENT_COLOR}}; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px;">2 min read</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:16px 32px 8px 32px;">
              <div style="font-size:28px; font-weight:700; color:{{BRAND_HEADING_COLOR}}; line-height:1.3; letter-spacing:-0.02em;">{{HOOK}}</div>
            </td>
          </tr>

          <tr>
            <td style="padding:8px 0 0 0;">
              <!-- HERO_ILLUSTRATION_HTML is injected by render.py, see illustrations.py -->
              {{HERO_ILLUSTRATION_HTML}}
            </td>
          </tr>

          <tr>
            <td style="padding:0 32px 20px 32px;">
              <div style="font-size:16px; color:{{BRAND_BODY_COLOR}}; line-height:1.65;">{{INSIGHT_PARAGRAPH}}</div>
            </td>
          </tr>

          <tr>
            <td style="padding:0 32px 8px 32px;">
              <!-- SUPPORTING_POINTS_HTML is injected as a checkmark list by render.py -->
              {{SUPPORTING_POINTS_HTML}}
            </td>
          </tr>

          <tr>
            <td style="padding:8px 32px 24px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:{{BRAND_FOOTER_BG}}; border-radius:12px; border-left:4px solid {{BRAND_HEADING_COLOR}};">
                <tr>
                  <td style="padding:16px 20px; font-size:16px; color:{{BRAND_HEADING_COLOR}}; line-height:1.6; font-weight:500;">{{CLOSING_LINE}}</td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:0 32px 24px 32px;">
              <a href="{{CTA_URL}}" style="display:inline-block; background-color:{{BRAND_ACCENT_COLOR}}; color:#ffffff; text-decoration:none; padding:12px 28px; border-radius:999px; font-size:15px; font-weight:600;">{{CTA_LABEL}}</a>
            </td>
          </tr>

          <tr>
            <td style="padding:0 32px 32px 32px; border-top:1px solid {{BRAND_BORDER_COLOR}}; padding-top:24px;">
              <div style="font-size:13px; color:{{BRAND_MUTED_COLOR}}; line-height:1.6;">
                Based on: {{SOURCE_STUDY}}<br>
                You're getting this because you're part of Hercules.works.
                <a href="{{UNSUBSCRIBE_URL}}" style="color:{{BRAND_MUTED_COLOR}};">Unsubscribe</a>
              </div>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
