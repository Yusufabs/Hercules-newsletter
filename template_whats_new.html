<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's New on Hercules.works</title>
</head>
<!-- Product-update campaign template (see whats_new.py). Cream hero band
     + illustration colors are sampled from the real hercules.works
     homepage hero, not the blog-page tokens template.html uses -- this
     is a deliberately different visual identity for this campaign,
     inspired by the homepage screenshot the design was reviewed against. -->
<body style="margin:0; padding:0; background-color:#f4f4f4; font-family:Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:12px; overflow:hidden;">

          <!-- Hero band -->
          <tr>
            <td style="background-color:#FDF9EC; padding:28px 32px 8px 32px;">
              <div style="font-size:13px; color:#8A8577; margin:0 0 16px 0;">{{GREETING}}</div>
              <div style="font-family:Helvetica, Arial, sans-serif; font-size:30px; font-weight:700; color:#0E0C0C; line-height:1.25;">{{HEADLINE_LINE1}}</div>
              <div style="font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:36px; color:#0E0C0C; line-height:1.25; margin:0 0 16px 0;">{{HEADLINE_LINE2_ITALIC}}</div>
              <div style="font-size:15px; color:#3A3630; line-height:1.6; margin:0 0 20px 0;">{{TAGLINE}}</div>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="padding:0 0 24px 0;">
                    <!-- HERO_ILLUSTRATION_HTML injected by whats_new.py, see illustrations.py -->
                    {{HERO_ILLUSTRATION_HTML}}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Intro -->
          <tr>
            <td style="padding:28px 32px 4px 32px;">
              {{INTRO_HTML}}
            </td>
          </tr>

          <!-- Feature sections, injected by whats_new.py -->
          {{SECTIONS_HTML}}

          <tr><td style="padding:0 32px;"><div style="border-top:1px solid {{BRAND_BORDER_COLOR}};"></div></td></tr>

          <!-- Qualitative research -->
          <tr><td style="height:8px;"></td></tr>
          {{QUALITATIVE_HTML}}

          <tr><td style="padding:0 32px;"><div style="border-top:1px solid {{BRAND_BORDER_COLOR}};"></div></td></tr>

          <!-- Pricing -->
          <tr><td style="height:8px;"></td></tr>
          {{PRICING_HTML}}

          <!-- Sign-off -->
          <tr>
            <td align="center" style="padding:8px 32px 32px 32px;">
              <div style="font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:18px; color:{{BRAND_HEADING_COLOR}};">{{SIGNOFF}}</div>
            </td>
          </tr>

          <tr>
            <td style="padding:0 32px 32px 32px; border-top:1px solid {{BRAND_BORDER_COLOR}}; padding-top:24px;">
              <div style="font-size:13px; color:{{BRAND_MUTED_COLOR}}; line-height:1.6;">
                You're getting this because you're part of Hercules.works.
                <a href="{{UNSUBSCRIBE_URL}}" style="color:{{BRAND_MUTED_COLOR}};">Unsubscribe</a>
              </div>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
