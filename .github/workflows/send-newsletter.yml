name: Send weekly newsletter

# SAFETY: all automatic triggers are OFF by explicit request (2026-09-24).
# This workflow currently only runs when a human clicks "Run workflow"
# in the Actions tab, AND even then it will not send until the
# `production-send` environment approval gate below is granted -- see
# README "Approval gate" for one-time setup. Nothing sends unattended.
#
# The old schedule (Thursday 08:00 IST / 02:30 UTC) is kept below,
# commented out, for reference. Do not uncomment it without the user's
# explicit go-ahead, and only after the approval gate has been set up
# and tested at least once via manual dispatch.
# schedule:
#   - cron: "30 2 * * 4"
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no real emails sent)"
        type: boolean
        default: true

jobs:
  send:
    runs-on: ubuntu-latest
    # Requires a "production-send" environment configured in
    # Settings -> Environments with "Required reviewers" turned on --
    # see README "Approval gate". Without that one-time setup, this key
    # is a no-op and does NOT gate anything by itself.
    environment: production-send
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Send newsletter
        env:
          NEWSLETTER_DATA_SOURCE: api
          NEWSLETTER_DRY_RUN: ${{ inputs.dry_run }}
          HERCULES_API_BASE: ${{ secrets.HERCULES_API_BASE }}
          HERCULES_API_KEY: ${{ secrets.HERCULES_API_KEY }}
          POSEIDON_API_BASE: ${{ secrets.POSEIDON_API_BASE }}
          POSEIDON_API_KEY: ${{ secrets.POSEIDON_API_KEY }}
          ESP_API_KEY: ${{ secrets.ESP_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          NEWSLETTER_ILLUSTRATION_MODE: ${{ secrets.NEWSLETTER_ILLUSTRATION_MODE }}
          BRAND_ILLUSTRATION_ASSET_URL: ${{ secrets.BRAND_ILLUSTRATION_ASSET_URL }}
        run: python3 send.py

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-run-log
          path: logs/
          retention-days: 90

      - name: Commit sent-issue archive
        # always(): still archive after a partial send where some
        # recipients failed (send.py exits non-zero in that case).
        if: ${{ always() && inputs.dry_run == false }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Archive sent newsletter issue"
          file_pattern: "content/sent/*.json"
